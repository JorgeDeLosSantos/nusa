name: Tests

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install NuSA and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest

  mesh-integration:
    name: Gmsh integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Gmsh
        run: |
          sudo apt-get update
          sudo apt-get install -y gmsh
          gmsh --version

      - name: Install NuSA and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run real Gmsh smoke test
        run: python -m pytest tests/test_mesh_subsystem.py::test_real_gmsh_rectangle_mesh_smoke

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and validate package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
          cd /tmp
          python - <<'PY'
          import numpy as np
          import nusa
          from nusa import Node, Spring, SpringModel

          assert nusa.__version__ == "0.3.0b1"

          model = SpringModel("wheel smoke")
          n1 = Node((0.0, 0.0))
          n2 = Node((0.0, 0.0))
          model.add_nodes([n1, n2])
          model.add_element(Spring((n1, n2), 100.0))
          model.add_constraint(n1, ux=0.0)
          model.add_force(n2, (50.0,))
          model.solve()

          assert np.isclose(n2.ux, 0.5)
          assert np.isclose(model.reaction(n1)["fx"], -50.0)
          print(nusa.__version__)
          PY

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build Sphinx documentation
        run: python -m sphinx -b html docs/source docs/_build/html
